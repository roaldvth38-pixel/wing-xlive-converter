name: Build Dolby740 macOS Installer

on:
  workflow_dispatch:
    inputs:
      plugin_version:
        description: "Version label for generated PKG filename"
        required: false
        default: "0.1.0"
      sign_pkg:
        description: "Sign plugin bundle and installer package (requires secrets)"
        type: boolean
        required: true
        default: false
  push:
    tags:
      - "dolby740-v*"
  release:
    types:
      - published

jobs:
  build-macos-installer:
    name: Build Dolby740 macOS PKG
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve workflow inputs
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.plugin_version }}"
            SIGN_PKG="${{ inputs.sign_pkg }}"
          elif [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            VERSION="${{ github.event.release.tag_name }}"
            SIGN_PKG="false"
          else
            VERSION="${GITHUB_REF_NAME#dolby740-v}"
            SIGN_PKG="false"
          fi

          VERSION="${VERSION#v}"

          if [[ -z "${VERSION}" ]]; then
            VERSION="0.1.0"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sign_pkg=${SIGN_PKG}" >> "$GITHUB_OUTPUT"

      - name: Verify Dolby740 target exists
        shell: bash
        run: |
          if ! grep -q "juce_add_plugin(Dolby740" CMakeLists.txt; then
            echo "Missing juce_add_plugin(Dolby740 ...) in CMakeLists.txt"
            exit 1
          fi

          if [[ ! -f "src/dolby740/Dolby740Processor.cpp" ]]; then
            echo "Missing source file: src/dolby740/Dolby740Processor.cpp"
            exit 1
          fi

      - name: Configure CMake (Ninja, Release)
        shell: bash
        run: |
          cmake -S . -B build-mac -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build unsigned macOS PKG
        if: ${{ steps.meta.outputs.sign_pkg != 'true' }}
        shell: bash
        run: |
          chmod +x ./package_dolby740_vst3_mac_installer.sh
          ./package_dolby740_vst3_mac_installer.sh \
            --version "${{ steps.meta.outputs.version }}" \
            --build-dir ./build-mac \
            --config Release \
            --plugin-target "Dolby740_VST3" \
            --plugin-bundle-name "Dolby 740.vst3" \
            --package-name "Dolby740_VST3" \
            --pkg-id "com.audioplugincreator.dolby740.vst3"

      - name: Build signed macOS PKG
        if: ${{ steps.meta.outputs.sign_pkg == 'true' }}
        shell: bash
        env:
          SIGN_APP_IDENTITY: ${{ secrets.MAC_SIGN_APP_IDENTITY }}
          SIGN_INSTALLER_IDENTITY: ${{ secrets.MAC_SIGN_INSTALLER_IDENTITY }}
        run: |
          if [[ -z "$SIGN_APP_IDENTITY" || -z "$SIGN_INSTALLER_IDENTITY" ]]; then
            echo "Missing required signing secrets."
            echo "Expected: MAC_SIGN_APP_IDENTITY and MAC_SIGN_INSTALLER_IDENTITY"
            exit 1
          fi

          chmod +x ./package_dolby740_vst3_mac_installer.sh
          ./package_dolby740_vst3_mac_installer.sh \
            --version "${{ steps.meta.outputs.version }}" \
            --build-dir ./build-mac \
            --config Release \
            --plugin-target "Dolby740_VST3" \
            --plugin-bundle-name "Dolby 740.vst3" \
            --package-name "Dolby740_VST3" \
            --pkg-id "com.audioplugincreator.dolby740.vst3" \
            --sign-app-identity "$SIGN_APP_IDENTITY" \
            --sign-installer-identity "$SIGN_INSTALLER_IDENTITY"

      - name: Upload macOS PKG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dolby740-macos-pkg
          path: release/installer-macos/Dolby740_VST3_*.pkg
          if-no-files-found: error